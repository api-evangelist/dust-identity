note: >-
  DUST Identity publishes no pricing of any kind. There is no /pricing page
  (https://www.dustidentity.com/pricing returns 404), no plans or tiers page, no
  per-seat or per-tag rate, and no metered API pricing in the developer documentation.
  The entire commercial motion runs through "Get a Demo" and "Start for free"
  call-to-action buttons that route to the contact form, plus a DICE login for existing
  customers. Access to the API itself is additionally gated at the organization level:
  Service Accounts must be enabled for an organization by DUST before an admin can even
  create an API key, and the documentation directs admins whose tenant lacks the feature
  to email support@dustidentity.com. The typed TypeScript client is likewise
  "available to integration customers on request". This is an enterprise contact-sales
  model end to end.

  - section: Error handling
    kind: typescript
    language: ts
    code: |-
      import { ApiError } from "@dustid/apid-client";


      try {
        await client.threads.get(threadId);
      } catch (error) {
        if (error instanceof ApiError) {
          // error.code    stable error code, e.g. "NOT_FOUND", "UNAUTHORIZED"
          // error.status  HTTP status number
          // error.message localized human-readable message
          // error.detail  optional extra context (validation issues, etc.)
          // error.body    the full { code, message, status, detail } payload
          if (error.code === "UNAUTHORIZED") {
            // token expired — re-exchange the API key and retry
          }
        } else {
          throw error; // network failure or non-JSON response
        }
      }

        bearerToken: token,
        organizationId,   // sent as Dust-Ctx-Org-Id
        teamId,           // optional; sent as Dust-Ctx-Team-Id when set
      });


      // createOne unwraps the batch response to the single created thread
      const created = await client.threads.createOne({
        type: "single",
        thread: {
          name: "Tire SZ3J-11-ZJ17",
          description: "Production asset",

                  message:
                    type: string
                  status:
                    const: 401
                  detail:
                    type: object
                    description: Extra context information specific to this error
                required:
                - code
                - message
                - status
        '403':
          description: Feature is currently disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    const: FEATURE_DISABLED
                  message:
                    type: string
                  status:
                    const: 403
                  detail:
                    type: object
                    description: Extra context information specific to this error
                required:
                - code
                - message
                - status
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    const: NOT_FOUND
                  message:
                    type: string
                  status:
                    const: 404
                  detail:
                    type: object
                    description: Extra context information specific to this error
                required:
                - code
                - message
                - status
      parameters:
      - schema:
          type: string
        in: path
        name: formId
        required: true
    patch:
      operationId: certificate_forms.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateFormUpdateRequest'
      summary: Update a Certificate Form.
      description: Update a Certificate Form (team admin). Forms are always editable; status is visibility only.
      tags:
      - Certificate Forms
      responses:
        '200':
          description: The updated Certificate Form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateFormResponse'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    const: INVALID_REQUEST
                  message:
                    type: string
                  status:
                    const: 400
                  detail:
                    type: object
                    description: Extra context information specific to this error
                required:
                - code
                - message
                - status
        '401':
          description: Unauthorized
          content:

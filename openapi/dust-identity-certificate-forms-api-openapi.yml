openapi: 3.2.0
info:
  title: DUST Certificate Forms API
  description: DUST Platform API
  version: 2026.7.4
servers:
- url: https://apid.dustid.io
  description: DUST API for trusted provenance.
security:
- Bearer: []
tags:
- name: Certificate Forms
  description: Create and manage certificate form designs
paths:
  /api/v1/certificate-forms:
    post:
      operationId: certificate_forms.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateFormCreateRequest'
      summary: Create a Certificate Form.
      description: Create a reusable, team-owned Certificate Form. Requires team admin.
      tags:
      - Certificate Forms
      responses:
        '200':
          description: The created Certificate Form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateFormResponse'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    const: INVALID_REQUEST
                  message:
                    type: string
                  status:
                    const: 400
                  detail:
                    type: object
                    description: Extra context information specific to this error
                required:
                - code
                - message
                - status
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    const: UNAUTHORIZED
                  message:
                    type: string
                  status:
                    const: 401
                  detail:
                    type: object
                    description: Extra context information specific to this error
                required:
                - code
                - message
                - status
        '403':
          description: Feature is currently disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    const: FEATURE_DISABLED
                  message:
                    type: string
                  status:
                    const: 403
                  detail:
                    type: object
                    description: Extra context information specific to this error
                required:
                - code
                - message
                - status
    get:
      operationId: certificate_forms.list
      parameters:
      - in: query
        name: includeArchived
        schema:
          anyOf:
          - enum:
            - 'false'
            - 'true'
          - type: boolean
      - in: query
        name: status
        schema:
          enum:
          - active
          - archived
      summary: List Certificate Forms.
      description: List the active team's Certificate Forms (active-only by default).
      tags:
      - Certificate Forms
      responses:
        '200':
          description: Certificate Forms.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CertificateFormResponse'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    const: INVALID_REQUEST
                  message:
                    type: string
                  status:
                    const: 400
                  detail:
                    type: object
                    description: Extra context information specific to this error
                required:
                - code
                - message
                - status
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    const: UNAUTHORIZED
                  message:
                    type: string
                  status:
                    const: 401
                  detail:
                    type: object
                    description: Extra context information specific to this error
                required:
                - code
                - message
                - status
        '403':
          description: Feature is currently disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    const: FEATURE_DISABLED
                  message:
                    type: string
                  status:
                    const: 403
                  detail:
                    type: object
                    description: Extra context information specific to this error
                required:
                - code
                - message
                - status
  /api/v1/certificate-forms/{formId}:
    get:
      operationId: certificate_forms.get
      summary: Get a Certificate Form.
      tags:
      - Certificate Forms
      responses:
        '200':
          description: The Certificate Form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateFormResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:

                  - success
                - type: object
                  properties:
                    tag:
                      type: object
                      properties:
                        archivedAt:
                          anyOf:
                          - type: string
                          - type: 'null'
                        createdAt:
                          type: string
                        description:
                          anyOf:
                          - type: string
                          - type: 'null'
                        isPrivate:
                          type: boolean
                        metadata:
                          anyOf:
                          - type: number
                          - type: object
                          - type: string
                          - type: boolean
                          - type: 'null'
                        name:
                          anyOf:
                          - type: string
                          - type: 'null'
                        ownerId:
                          type: string
                          description: a RFC-4122-compliant UUID
                          pattern: ^[\da-f]{8}(?:-[\da-f]{4}){3}-[\da-f]{12}$
                        tagId:
                          type: string
                          description: a RFC-4122-compliant UUID
                          pattern: ^[\da-f]{8}(?:-[\da-f]{4}){3}-[\da-f]{12}$
                        tagType:
                          type: string
                        threadId:
                          anyOf:
                          - type: string
                            description: a RFC-4122-compliant UUID
                            pattern: ^[\da-f]{8}(?:-[\da-f]{4}){3}-[\da-f]{12}$
                          - type: 'null'
                        transferId:
                          anyOf:
                          - type: string
                            description: a RFC-4122-compliant UUID
                            pattern: ^[\da-f]{8}(?:-[\da-f]{4}){3}-[\da-f]{12}$
                          - type: 'null'
                        transferredAt:
                          anyOf:
                          - type: string
                          - type: 'null'
                        updatedAt:
                          type: string
                        value:
                          type: string
                        voidedAt:
                          anyOf:
                          - type: string
                          - type: 'null'
                        indexing:
                          anyOf:
                          - const: default
                          - const: none
                          - type: 'null'
                        isBound:
                          anyOf:
                          - type: boolean
                          - type: 'null'
                        label:
                          anyOf:
                          - $ref: '#/components/schemas/LabelRef'
                          - type: 'null'

                      - metadata
                      - name
                      - ownerId
                      - tagId
                      - tagType
                      - threadId
                      - transferId
                      - transferredAt
                      - updatedAt
                      - value
                      - voidedAt
                    scan:
                      $ref: '#/components/schemas/ScanReceipt'
                  required:
                  - tag
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    const: INVALID_REQUEST
                  message:
                    type: string
                  status:
                    const: 400
                  detail:
                    type: object
                    description: Extra context information specific to this error
                required:

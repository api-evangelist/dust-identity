                            description: a RFC-4122-compliant UUID
                            pattern: ^[\da-f]{8}(?:-[\da-f]{4}){3}-[\da-f]{12}$
                          - type: 'null'
                        transferredAt:
                          anyOf:
                          - type: string
                          - type: 'null'
                        updatedAt:
                          type: string
                        value:
                          type: string
                        voidedAt:
                          anyOf:
                          - type: string
                          - type: 'null'
                        indexing:
                          anyOf:
                          - const: default
                          - const: none
                          - type: 'null'
                        isBound:
                          anyOf:
                          - type: boolean
                          - type: 'null'
                        label:
                          anyOf:
                          - $ref: '#/components/schemas/LabelRef'
                          - type: 'null'

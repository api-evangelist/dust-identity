                        indexing:
                          anyOf:
                          - const: default
                          - const: none
                          - type: 'null'
                        isBound:
                          anyOf:
                          - type: boolean
                          - type: 'null'
                      required:
                      - archivedAt
                      - createdAt
                      - description
                      - isPrivate
                      - metadata
                      - name
                      - ownerId
                      - tagId
                      - tagType
                      - threadId
                      - transferId
                      - transferredAt
                      - updatedAt
                      - value
                  required:
                  - attemptedCount
                  - failedCount
                  - success
                - type: object
                  properties:
                    tag:
                      type: object
                      properties:
                        archivedAt:
                          anyOf:
                          - type: string

                      description: a UUID
                      format: uuid
                    description: a UUID
                    format: uuid
              required:
              - childrenIds
      summary: Set bundle children
      tags:
      - Bundles
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: boolean
        '400':
          description: Invalid Request
          content:
            application/json:

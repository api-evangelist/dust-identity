openapi: 3.2.0
info:
  title: DUST Connections API
  description: DUST Platform API
  version: 2026.7.4
servers:
- url: https://apid.dustid.io
  description: DUST API for trusted provenance.
security:
- Bearer: []
tags:
- name: Connections
  description: Connections (team links) between Teams; they gate sharing and shipments
paths:
  /api/v1/connections:
    post:
      operationId: connections.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allow:
                  enum:
                  - receive
                  - send
                  - send_receive
                email:
                  type: string
                  pattern: ^[\w%+.-]+@[\d.A-Za-z-]+\.[A-Za-z]{2,}$
                  format: email
              required:
              - allow
      summary: Create a connection
      description: Create a connection invite, which enables sharing between the two teams once accepted.
      tags:
      - Connections
      responses:
        '200':
          description: Created connection
          content:
            application/json:
              schema:
                type: object
                properties:
                  acceptingTeamId:
                    anyOf:
                    - type: string
                      description: a RFC-4122-compliant UUID
                      pattern: ^[\da-f]{8}(?:-[\da-f]{4}){3}-[\da-f]{12}$
                    - type: 'null'
                  allow:
                    type: string
                  amendmentAcceptedById:
                    anyOf:
                    - type: string
                      description: a RFC-4122-compliant UUID
                      pattern: ^[\da-f]{8}(?:-[\da-f]{4}){3}-[\da-f]{12}$
                    - type: 'null'
                  amendmentProposedById:
                    anyOf:
                    - type: string
                      description: a RFC-4122-compliant UUID
                      pattern: ^[\da-f]{8}(?:-[\da-f]{4}){3}-[\da-f]{12}$
                    - type: 'null'
                  amendmentProposerTeamId:
                    anyOf:
                    - type: string
                      description: a RFC-4122-compliant UUID
                      pattern: ^[\da-f]{8}(?:-[\da-f]{4}){3}-[\da-f]{12}$
                    - type: 'null'
                  amendmentStatus:
                    anyOf:
                    - type: string
                    - type: 'null'
                  amendmentUpdatedAt:
                    anyOf:
                    - type: string
                    - type: 'null'
                  code:
                    type: string
                    description: a RFC-4122-compliant UUID
                    pattern: ^[\da-f]{8}(?:-[\da-f]{4}){3}-[\da-f]{12}$
                  createdAt:
                    type: string
                  createdById:

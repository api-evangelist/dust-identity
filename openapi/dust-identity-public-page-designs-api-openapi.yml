components:
  schemas:
    PublicPageEvent:
      type: object
      properties:
        action:
          type: string
        eventId:
          anyOf:
          - type: string
            description: a UUID
            format: uuid
            pattern: ^[\da-f]{8}-[\da-f]{4}-[1-8][\da-f]{3}-[89ab][\da-f]{3}-[\da-f]{12}$
          - const: 00000000-0000-0000-0000-000000000000
            description: a UUID
            format: uuid
          - const: ffffffff-ffff-ffff-ffff-ffffffffffff
            description: a UUID
            format: uuid
          description: a UUID
          format: uuid
        occurred:
          type: string
        actorOrgName:
          anyOf:
          - type: string
          - type: 'null'
        actorTeamName:
          anyOf:
          - type: string
          - type: 'null'
        claim:
          $ref: '#/components/schemas/PublicPageEventClaim'
        origin:
          $ref: '#/components/schemas/PublicPageEventOrigin'
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/PublicPageEventSubject'
        upstream:
          type: boolean
      required:
      - action
      - eventId
      - occurred
      additionalProperties: false
    PublicPageDesignCreateRequest:
      type: object
      properties:
        name:
          type: string
        draft:
          $ref: '#/components/schemas/PublicPageDesignDraftDocument'
      required:
      - name
      additionalProperties: false
    PublicPagePreflightBinding:
      type: object
      properties:
        bindingKey:
          type: string
        blockKey:
          type: string
        matchedFieldName:
          anyOf:
          - type: string
          - type: 'null'
        message:
          anyOf:
          - type: string
          - type: 'null'
        required:
          type: boolean
        status:
          enum:
          - ambiguous
          - empty
          - missing
          - resolved
          - type_mismatch
      required:
      - bindingKey
      - blockKey
      - matchedFieldName
      - message
      - required
      - status
      additionalProperties: false
    PublicPageAccentColor:
      type: string
      pattern: ^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})$
    PublicPageLinkItem:
      type: object
      properties:
        label:
          type: string
        url:
          $ref: '#/components/schemas/PublicPageHttpsUrl'
      required:
      - label
      - url
      additionalProperties: false
    PublicPageDesignStyling:
      type: object
      properties:
        accentColor:
          $ref: '#/components/schemas/PublicPageAccentColor'
        fontFamily:
          enum:
          - mono
          - sans
          - serif
        footerColor:
          $ref: '#/components/schemas/PublicPageAccentColor'
        headerColor:
          $ref: '#/components/schemas/PublicPageAccentColor'
        logoResId:
          anyOf:
          - type: string
            description: a UUID
            format: uuid

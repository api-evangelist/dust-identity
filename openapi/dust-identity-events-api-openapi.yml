openapi: 3.2.0
info:
  title: DUST Events API
  description: DUST Platform API
  version: 2026.7.4
servers:
- url: https://apid.dustid.io
  description: DUST API for trusted provenance.
security:
- Bearer: []
tags:
- name: Events
  description: Work with system events
paths:
  /api/v1/events:
    get:
      operationId: events.list
      summary: List events
      tags:
      - Events
      responses:
        '200':
          description: List of events (Activity Groups when grouped).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    const: INVALID_REQUEST
                  message:
                    type: string
                  status:
                    const: 400
                  detail:
                    type: object
                    description: Extra context information specific to this error
                required:
                - code
                - message
                - status
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    const: UNAUTHORIZED
                  message:
                    type: string
                  status:
                    const: 401
                  detail:
                    type: object
                    description: Extra context information specific to this error
                required:
                - code
                - message
                - status
        '500':
          description: Unknown error occurred
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    const: UNKNOWN_ERROR
                  message:
                    type: string
                  status:
                    const: 500
                  detail:
                    type: object
                    description: Extra context information specific to this error
                required:
                - code
                - message
                - status
      parameters:
      - in: query
        name: actionFilter
        schema:
          anyOf:
          - type: string
          - type: array
            items:
              type: string
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: excludeActionFilter
        schema:
          type: string
      - in: query
        name: groupBy
        schema:
          const: activity
      - in: query
        name: occurred
        schema:
          type: string
      - in: query
        name: order
        schema:
          enum:
          - asc
          - desc
      - in: query
        name: orgId
        schema:
          type: string
      - in: query
        name: pageSize
        schema:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?:(?!^-0\.?0*$)(?:-?(?:(?:0|[1-9]\d*)(?:\.\d+)?)|\.\d+?))$
      - in: query
        name: teamId
        schema:
          type: string
      - in: query
        name: threadId
        schema:
          type: string
      - in: query
        name: withTargets
        schema:
          anyOf:
          - const: 'false'
          - const: 'true'
          - type: boolean
      - in: query
        name: withUser
        schema:
          anyOf:
          - const: 'false'
          - const: 'true'
          - type: boolean

            pattern: ^[\da-f]{8}(?:-[\da-f]{4}){3}-[\da-f]{12}$
          - type: 'null'
        description:
          anyOf:
          - type: string
          - type: 'null'
        fieldId:
          type: string
          description: a RFC-4122-compliant UUID
          pattern: ^[\da-f]{8}(?:-[\da-f]{4}){3}-[\da-f]{12}$
        isPrivate:
          type: boolean
        isRequired:
          type: boolean
        name:
          anyOf:
          - type: string

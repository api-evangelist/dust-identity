      - in: query
        name: actionFilter
        schema:
          anyOf:
          - type: string
          - type: array
            items:
              type: string
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: excludeActionFilter
        schema:
          type: string
      - in: query
        name: fieldId
        schema:

                  message:
                    type: string
                  status:
                    const: 401
                  detail:
                    type: object
                    description: Extra context information specific to this error
                required:
                - code
                - message
                - status
        '403':
          description: Team context access is denied or the feature is disabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:

openapi: 3.2.0
info:
  title: DUST System API
  description: DUST Platform API
  version: 2026.10.0
servers:
- url: https://apid.dustid.io
  description: DUST API for trusted provenance.
security:
- Bearer: []
tags:
- name: System
  description: Health and status checks
paths:
  /livez:
    get:
      operationId: get_liveness
      summary: Liveness check
      tags:
      - System
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      operationId: get_readiness
      summary: Readiness check
      tags:
      - System
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthErrorResponse'
  /healthz:
    get:
      operationId: get_health
      summary: Health check
      tags:
      - System
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthErrorResponse'
components:
  schemas:
    HealthErrorResponse:
      type: object
      properties:
        status:
          const: error
        timestamp:
          type: string
      required:
      - status
      - timestamp
    HealthResponse:
      type: object
      properties:
        status:
          const: ok
        timestamp:
          type: string
      required:
      - status
      - timestamp
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by the DUST auth service. Obtain one by exchanging a Service Account API key (`GET /api/auth/token` with the key header) or via the OAuth2 `client_credentials` grant. Tokens are short-lived; re-exchange on expiry.
x-tagTeams:
- name:   Core

  /api/v1/fabric/threads/{thread_id}/disclosure/preview:
    post:
      operationId: fabric.preview_disclosure_change
      parameters:
      - in: path
        name: thread_id
        schema:
          anyOf:
          - type: string
            description: a UUID
            format: uuid
            pattern: '[\da-f]{8}-[\da-f]{4}-[1-8][\da-f]{3}-[89ab][\da-f]{3}-[\da-f]{12}'
          - const: 00000000-0000-0000-0000-000000000000

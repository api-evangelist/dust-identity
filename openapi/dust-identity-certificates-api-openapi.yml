                dateFormat:
                  type: string
                format:
                  type: object
                  properties:
                    align:
                      enum:
                      - center
                      - left
                      - right
                    backgroundColor:
                      type: string
                    barColor:
                      type: string
                    fontColor:
                      type: string
                    fontName:
                      type: string
                    fontSize:
                      type: number
                    opacity:
                      type: number
                    rotate:
                      type: number
                    showText:
                      type: boolean
                renderAs:
                  enum:
                  - code128
                  - code39
                  - pdf417
                  - qrcode
                  - text
                systemAliases:
                  type: array
                  items:
                    enum:
                    - certificate.issueDate
                    - issuer.familyName
                    - issuer.firstName
                    - issuer.fullName
                    - issuer.teamName
                    - thread.description
                    - thread.identifiers
                    - thread.name
                    - thread.thumbnail
                    - thread.uuid
              required:
              - kind

      - Certificates
      responses:
        '200':
          description: Base64-encoded preview PDF.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificatePreviewFormResponse'
        '400':
          description: Invalid data provided
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    const: INVALID_DATA
                  message:
                    type: string
                  status:
                    const: 400
                  detail:

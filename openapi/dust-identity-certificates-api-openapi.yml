      - zones
    CertificatePreviewFormForThreadResponse:
      type: object
      properties:
        pdfBase64:
          type: string
        preflight:
          $ref: '#/components/schemas/CertificatePreviewPreflight'
      required:
      - pdfBase64
      - preflight
    CertificateResolveFormValuesRequest:
      type: object
      properties:
        bindings:
          type: array
          items:
            anyOf:
            - type: object
              properties:
                kind:
                  enum:
                  - boolean
                  - date
                  - image
                  - number
                  - text
                primaryName:
                  type: string
                required:
                  type: boolean
                source:
                  const: field
                zoneId:
                  type: string
                aliases:
                  type: array
                  items:
                    type: string
                dateFormat:
                  type: string
                format:
                  type: object
                  properties:
                    align:
                      enum:
                      - center
                      - left
                      - right
                    backgroundColor:
                      type: string
                    barColor:
                      type: string
                    fontColor:
                      type: string
                    fontName:
                      type: string
                    fontSize:
                      type: number
                    opacity:
                      type: number
                    rotate:
                      type: number
                    showText:
                      type: boolean
                renderAs:
                  enum:
                  - code128
                  - code39
                  - pdf417
                  - qrcode
                  - text
                systemAliases:
                  type: array
                  items:
                    enum:
                    - certificate.issueDate
                    - issuer.familyName
                    - issuer.firstName
                    - issuer.fullName
                    - issuer.teamName
                    - thread.description
                    - thread.identifiers
                    - thread.name
                    - thread.thumbnail
                    - thread.uuid
              required:
              - kind
              - primaryName
              - required
              - source
              - zoneId
            - type: object
              properties:
                required:
                  type: boolean
                source:
                  const: static
                staticKind:
                  const: text
                text:
                  type: string
                zoneId:
                  type: string
                format:
                  type: object
                  properties:
                    align:
                      enum:
                      - center
                      - left
                      - right
                    backgroundColor:
                      type: string
                    barColor:
                      type: string
                    fontColor:
                      type: string
                    fontName:
                      type: string
                    fontSize:
                      type: number
                    opacity:
                      type: number
                    rotate:
                      type: number
                    showText:
                      type: boolean
                renderAs:
                  enum:
                  - code128
                  - code39
                  - pdf417
                  - qrcode
                  - text
              required:
              - required
              - source
              - staticKind
              - text
              - zoneId
            - type: object
              properties:
                required:
                  type: boolean
                source:
                  const: system
                systemKey:
                  enum:
                  - certificate.issueDate
                  - issuer.familyName
                  - issuer.firstName
                  - issuer.fullName
                  - issuer.teamName
                  - thread.description
                  - thread.identifiers
                  - thread.name
                  - thread.thumbnail
                  - thread.uuid
                zoneId:
                  type: string
                dateFormat:
                  type: string
                format:
                  type: object
                  properties:
                    align:
                      enum:
                      - center
                      - left
                      - right
                    backgroundColor:
                      type: string
                    barColor:
                      type: string
                    fontColor:
                      type: string
                    fontName:
                      type: string
                    fontSize:
                      type: number
                    opacity:
                      type: number
                    rotate:
                      type: number
                    showText:
                      type: boolean
                renderAs:
                  enum:
                  - code128
                  - code39
                  - pdf417
                  - qrcode
                  - text
              required:
              - required
              - source
              - systemKey
              - zoneId
        threadId:
          anyOf:
          - type: string
            description: a UUID
            format: uuid
            pattern: '[\da-f]{8}-[\da-f]{4}-[1-8][\da-f]{3}-[89ab][\da-f]{3}-[\da-f]{12}'
          - const: 00000000-0000-0000-0000-000000000000
            description: a UUID
            format: uuid
          - const: ffffffff-ffff-ffff-ffff-ffffffffffff
            description: a UUID
            format: uuid
          description: a UUID
          format: uuid
        teamName:
          type: string
      required:
      - bindings
      - threadId
    CertificatePreflightResult:
      type: object
      properties:
        bindings:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              matchedFieldName:
                anyOf:
                - type: string
                - type: 'null'
              message:
                anyOf:
                - type: string
                - type: 'null'
              nonExact:
                type: boolean
              required:
                type: boolean
              source:
                enum:
                - field
                - static
                - system
              status:
                enum:
                - ambiguous
                - empty
                - missing
                - resolved
                - type_mismatch
                - unencodable
              zoneId:
                type: string
            required:
            - label
            - matchedFieldName
            - message
            - nonExact
            - required
            - source
            - status
            - zoneId
        compatible:
          type: boolean
        formId:
          anyOf:
          - type: string
            description: a UUID
            format: uuid
            pattern: '[\da-f]{8}-[\da-f]{4}-[1-8][\da-f]{3}-[89ab][\da-f]{3}-[\da-f]{12}'
          - const: 00000000-0000-0000-0000-000000000000
            description: a UUID
            format: uuid
          - const: ffffffff-ffff-ffff-ffff-ffffffffffff
            description: a UUID
            format: uuid
          description: a UUID
          format: uuid
        requiredResolved:
          type: number
        requiredTotal:
          type: number
        threadId:
          anyOf:
          - type: string
            description: a UUID
            format: uuid
            pattern: '[\da-f]{8}-[\da-f]{4}-[1-8][\da-f]{3}-[89ab][\da-f]{3}-[\da-f]{12}'
          - const: 00000000-0000-0000-0000-000000000000
            description: a UUID
            format: uuid
          - const: ffffffff-ffff-ffff-ffff-ffffffffffff
            description: a UUID
            format: uuid
          description: a UUID
          format: uuid
      required:
      - bindings
      - compatible
      - formId
      - requiredResolved
      - requiredTotal
      - threadId

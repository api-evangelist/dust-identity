          type: string
        description: Opaque cursor from a previous page's nextCursor
      - in: query
        name: order
        schema:
          anyOf:
          - const: asc
            description: Sort direction; default desc
          - const: desc
            description: Sort direction; default desc
        description: Sort direction; default desc
      - in: query
        name: pageSize
        schema:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?:(?!^-0\.?0*$)(?:-?(?:(?:0|[1-9]\d*)(?:\.\d+)?)|\.\d+?))$
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: sort
        schema:
          anyOf:
          - const: name
            description: Sort key; default updatedAt
          - const: updatedAt
            description: Sort key; default updatedAt
        description: Sort key; default updatedAt

                - code
                - message
                - status
        '403':
          description: Feature is currently disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    const: FEATURE_DISABLED
                  message:
                    type: string
                  status:
                    const: 403
                  detail:
                    type: object

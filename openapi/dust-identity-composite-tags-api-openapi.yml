          type: integer
          description: Labels with a matched QA Check for every Identifier type in the Reel's expected composition
          minimum: 0
        lastCheckedAt:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - checkedCount
      - failedCount
      - flaggedCount
      - fullyCheckedCount
      - lastCheckedAt

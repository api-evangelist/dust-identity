      summary: Download a file, thread, or shipment PDF receipt
      description: A dated, unsigned PDF snapshot of records visible to the authenticated caller in the active team context. Includes metadata, SHA-256 file checksums, permitted transaction log entries, and a QR link to DICE. No receipt file or transaction event is stored. Shipment receipts use the same sender/recipient visibility and manifest rules as shipment detail. Optional linkId or transferId selects a disclosed or offered file's read context; these cannot be combined and apply only to file receipts. Private data is excluded by default, including events involving private assets. includePrivate=true is permitted only in the owning team context and marks each page Proprietary with the organization name. timeZone accepts an IANA timezone and defaults to UTC; dates display their UTC offsets. options=true returns authorized export choices as JSON (canIncludePrivate, requiresPrivate, organization, team, requester), without generating a receipt. Large exports exceeding 10,000 visible events fail with an error rather than silently truncating.
      tags:
      - Files
      responses:
        '200':
          description: PDF receipt
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: object
                required:
                - canIncludePrivate
                - requiresPrivate
                - organization
                - team
                - requester

          anyOf:
          - const: 'false'
          - const: 'true'
          - type: boolean
      - in: query
        name: q
        schema:
          type: string
      summary: List the assembly Threads the caller can view
      tags:
      - Threads
      responses:
        '200':
          description: Assemblies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssemblyListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    const: UNAUTHORIZED
                  message:
                    type: string
                  status:
                    const: 401
                  detail:
                    type: object
                    description: Extra context information specific to this error
                required:
                - code
                - message
                - status

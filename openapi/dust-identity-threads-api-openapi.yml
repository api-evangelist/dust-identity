  /api/v1/threads:
    post:
      operationId: threads.create
      summary: Create one or more threads
      description: Create multiple threads in a single request. Allows for key-value thread objects and automatically build the necessary thread field data structure for each thread.
      tags:
      - Threads
      responses:
        '201':
          description: Created threads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadCreateResponse'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    const: INVALID_REQUEST
                  message:
                    type: string
                  status:
                    const: 400
                  detail:
                    type: object
                    description: Extra context information specific to this error
                required:
                - code
                - message
                - status
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    const: UNAUTHORIZED
                  message:
                    type: string
                  status:
                    const: 401
                  detail:
                    type: object
                    description: Extra context information specific to this error
                required:
                - code
                - message
                - status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/ThreadCreateManyRawRequest'
              - $ref: '#/components/schemas/ThreadCreateSingleRequest'
              - $ref: '#/components/schemas/ThreadCreateManyRequest'
    get:
      operationId: threads.list
      summary: List threads with cursor pagination.
      tags:
      - Threads
      responses:
        '200':
          description: List of threads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadQueryResponse'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    const: INVALID_REQUEST
                  message:
                    type: string
                  status:
                    const: 400
                  detail:
                    type: object
                    description: Extra context information specific to this error
                required:
                - code
                - message
                - status
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    const: UNAUTHORIZED
                  message:
                    type: string
                  status:
                    const: 401
                  detail:
                    type: object
                    description: Extra context information specific to this error
                required:
                - code
                - message
                - status
      parameters:
      - in: query
        name: archivedOnly
        schema:
          anyOf:
          - const: 'false'
          - const: 'true'
          - type: boolean
      - in: query
        name: bundleId
        schema:
          anyOf:
          - type: string
            description: Search within a bundle, or use 'none' for threads without a bundle
            format: uuid
            pattern: '[\da-f]{8}-[\da-f]{4}-[1-8][\da-f]{3}-[89ab][\da-f]{3}-[\da-f]{12}'
          - const: 00000000-0000-0000-0000-000000000000
            description: Search within a bundle, or use 'none' for threads without a bundle
            format: uuid
          - const: ffffffff-ffff-ffff-ffff-ffffffffffff
            description: Search within a bundle, or use 'none' for threads without a bundle
            format: uuid
          - const: none
            description: Search within a bundle, or use 'none' for threads without a bundle
        description: Search within a bundle, or use 'none' for threads without a bundle
      - in: query
        name: createdBy
        schema:
          anyOf:
          - type: string
            description: Filter by creator user ID
            format: uuid
            pattern: '[\da-f]{8}-[\da-f]{4}-[1-8][\da-f]{3}-[89ab][\da-f]{3}-[\da-f]{12}'
          - const: 00000000-0000-0000-0000-000000000000
            description: Filter by creator user ID
            format: uuid
          - const: ffffffff-ffff-ffff-ffff-ffffffffffff
            description: Filter by creator user ID
            format: uuid
          format: uuid
        description: Filter by creator user ID
      - in: query
        name: cursor
        schema:
          anyOf:
          - type: string
          - type: 'null'
      - in: query
        name: excludeTransferred
        schema:
          anyOf:
          - const: 'false'
          - const: 'true'
          - type: boolean
      - in: query
        name: hasResources
        schema:
          anyOf:
          - const: 'false'
          - const: 'true'
          - type: boolean
      - in: query
        name: includeArchived
        schema:
          anyOf:
          - const: 'false'
          - const: 'true'
          - type: boolean
      - in: query
        name: order
        schema:
          enum:
          - asc
          - desc
      - in: query
        name: orderCol
        schema:
          enum:
          - createdAt
          - name
          - updatedAt
      - in: query
        name: ownedByTeam
        schema:
          type: string
      - in: query
        name: pageSize
        schema:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?:(?!^-0\.?0*$)(?:-?(?:(?:0|[1-9]\d*)(?:\.\d+)?)|\.\d+?))$
      - in: query
        name: q
        schema:
          type: string
        description: Search query string. Searches over name and description by default.
      - in: query
        name: queryCol
        schema:
          enum:
          - description
          - name
      - in: query
        name: tagType
        schema:
          enum:
          - BAR_CODE
          - DATA_MATRIX
          - DUST
          - NFC
          - QR
      - in: query
        name: templateId
        schema:
          anyOf:
          - type: string
            description: Filter by thread template
            format: uuid
            pattern: '[\da-f]{8}-[\da-f]{4}-[1-8][\da-f]{3}-[89ab][\da-f]{3}-[\da-f]{12}'
          - const: 00000000-0000-0000-0000-000000000000
            description: Filter by thread template
            format: uuid
          - const: ffffffff-ffff-ffff-ffff-ffffffffffff
            description: Filter by thread template
            format: uuid
          format: uuid
        description: Filter by thread template
      - in: query
        name: threadIds
        schema:
          anyOf:
          - type: string
            description: Filter to this set of thread IDs (repeatable query param). Non-UUID values are ignored; threads the caller cannot see are silently omitted.
          - type: array
            description: Filter to this set of thread IDs (repeatable query param). Non-UUID values are ignored; threads the caller cannot see are silently omitted.
            items:
              type: string
        description: Filter to this set of thread IDs (repeatable query param). Non-UUID values are ignored; threads the caller cannot see are silently omitted.
      - in: query
        name: transferredOnly
        schema:
          anyOf:
          - const: 'false'
          - const: 'true'
          - type: boolean
      - in: query
        name: withActiveShipment
        schema:
          anyOf:
          - const: 'false'
          - const: 'true'
          - type: boolean
  /api/v1/threads/count:
    get:
      operationId: threads.count
      summary: Count threads with optional filters.
      description: Returns the exact total for the same filter set used by `threads.list`. Use this to compute totals or total pages when the list endpoint is using cursor pagination.
      tags:
      - Threads
      responses:
        '200':
          description: Total threads
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                required:
                - total
        '400':
          description: Invalid Request
          content:

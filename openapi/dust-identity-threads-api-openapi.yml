                    type: object
                    description: Extra context information specific to this error
                required:
                - code
                - message
                - status
      parameters:
      - in: query
        name: archivedOnly
        schema:
          anyOf:
          - const: 'false'
          - const: 'true'
          - type: boolean
      - in: query
        name: bundleId
        schema:
          anyOf:
          - type: string
            description: Search within a bundle, or use 'none' for threads without a bundle
            format: uuid
            pattern: '[\da-f]{8}-[\da-f]{4}-[1-8][\da-f]{3}-[89ab][\da-f]{3}-[\da-f]{12}'
          - const: 00000000-0000-0000-0000-000000000000
            description: Search within a bundle, or use 'none' for threads without a bundle
            format: uuid
          - const: ffffffff-ffff-ffff-ffff-ffffffffffff
            description: Search within a bundle, or use 'none' for threads without a bundle
            format: uuid
          - const: none
            description: Search within a bundle, or use 'none' for threads without a bundle
        description: Search within a bundle, or use 'none' for threads without a bundle
      - in: query
        name: createdBy
        schema:
          anyOf:
          - type: string

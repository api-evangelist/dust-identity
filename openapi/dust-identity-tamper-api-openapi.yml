  /api/v1/tamper/analyses/{analysis_id}/artifacts/{name}:
    get:
      operationId: tags.tamper_artifact
      parameters:
      - in: path
        name: analysis_id
        schema:
          anyOf:
          - type: string
            description: a UUID
            format: uuid
            pattern: ^[\da-f]{8}-[\da-f]{4}-[1-8][\da-f]{3}-[89ab][\da-f]{3}-[\da-f]{12}$
          - const: 00000000-0000-0000-0000-000000000000

                - const: 00000000-0000-0000-0000-000000000000
                  description: a UUID
                  format: uuid
                - const: ffffffff-ffff-ffff-ffff-ffffffffffff
                  description: a UUID
                  format: uuid
                description: a UUID
                format: uuid
              item:
                enum:
                - bundle
                - thread
              relation:

                format: uuid
            required:
            - id
            - item
            - relation
            - teamId
      required:
      - items
    ShareUpdateRequest:
      type: object
      properties:
        relation:
          enum:
          - admin
          - attached
          - container
          - creator
          - editor
          - member
          - owner
          - parent
          - private
          - protected
          - publish
          - sender
          - share
          - transfer
          - viewer
      required:
      - relation
    ShareRemoveRequest:
      type: object
      properties:
        ids:
          type: array
          description: Sharing instance ids
          items:
            anyOf:
            - type: string
              description: a UUID
              format: uuid
              pattern: '[\da-f]{8}-[\da-f]{4}-[1-8][\da-f]{3}-[89ab][\da-f]{3}-[\da-f]{12}'
            - const: 00000000-0000-0000-0000-000000000000
              description: a UUID
              format: uuid
            - const: ffffffff-ffff-ffff-ffff-ffffffffffff
              description: a UUID
              format: uuid
            description: a UUID
            format: uuid
      required:

openapi: 3.2.0
info:
  title: DUST Fields API
  description: DUST Platform API
  version: 2026.10.0
servers:
- url: https://apid.dustid.io
  description: DUST API for trusted provenance.
security:
- Bearer: []
tags:
- name: Fields
  description: Query thread data fields (Field Search support surfaces)
paths:
  /api/v1/fields/names:
    get:
      operationId: fields.names
      parameters:
      - in: query
        name: limit
        schema:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?:(?!^-0\.?0*$)(?:-?(?:(?:0|[1-9]\d*)(?:\.\d+)?)|\.\d+?))$
      - in: query
        name: q
        schema:
          type: string
        description: Case-insensitive substring filter over field names
      summary: List distinct field names
      description: Distinct names of non-archived fields on threads visible in the current context, for Field Search name typeahead.
      tags:
      - Fields
      responses:
        '200':
          description: Distinct field names
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldNamesResponse'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    const: INVALID_REQUEST
                  message:
                    type: string
                  status:
                    const: 400
                  detail:
                    type: object
                    description: Extra context information specific to this error
                required:
                - code
                - message
                - status
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    const: UNAUTHORIZED
                  message:
                    type: string
                  status:
                    const: 401
                  detail:
                    type: object
                    description: Extra context information specific to this error
                required:
                - code
                - message
                - status
        '500':
          description: Database error occurred
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    const: DB_ERROR
                  message:
                    type: string
                  status:
                    const: 500
                  detail:
                    type: object
                    description: Extra context information specific to this error
                required:
                - code
                - message
                - status
      x-required-role: member
components:
  schemas:
    FieldNamesResponse:
      type: object
      properties:
        names:
          type: array
          items:
            type: string
      required:
      - names
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by the DUST auth service. Obtain one by exchanging a Service Account API key (`GET /api/auth/token` with the key header) or via the OAuth2 `client_credentials` grant. Tokens are short-lived; re-exchange on expiry.
x-tagTeams:
- name:   Core
  tags:
  - System
  - Users
  - Teams
  - Connections
  - Org Admin
  - Organizations
  - Auth
- name:   Content
  tags:
  - Threads
  - Tags
  - Tamper
  - Templates
  - Fields
  - Files
  - Certificates
  - Certificate Forms
  - Composite Tags
  - Public Pages
  - Public Page Designs
  - Sharing
  - Thread Links
  - Thread Relations
  - Notifications
  - Bundles
  - Events
  - Metrics
  - Transfers

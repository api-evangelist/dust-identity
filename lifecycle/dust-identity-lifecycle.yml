generated: '2026-08-12'
method: searched
source: https://docs.dustid.io/api/compatibility/
also_from:
- https://docs.dustid.io/reference/environments/
- openapi/dust-identity-apid-openapi.yml
note: >-
  DUST publishes a genuine, specific compatibility and deprecation policy — a named
  90-day minimum window, an enumerated list of what counts as breaking, and the
  published OpenAPI named as the authoritative contract with deprecation markers in it.
  That is materially stronger than most providers of this size. What is missing is
  operational: there is no public status page, no SLA or uptime target, and no dated
  changelog or release-notes feed, so a consumer has no way to be told when something
  changed other than diffing the spec themselves — which is, explicitly, what DUST
  tells them to do.
versioning:
  scheme: uri-path
  current: v1
  path_root: /api/v1
  docs: https://docs.dustid.io/api/compatibility/
  major_version_policy: >-
    New major versions are rare by design. /api/v1 evolves additively; a /api/v2 would
    be introduced only for a reshape that cannot be expressed compatibly, and /api/v1
    would remain supported through a long, explicitly announced migration period.
  build_stamp: '2026.7.4'
  build_stamp_note: >-
    info.version in the OpenAPI is a calendar build stamp shared with the docs site,
    not an API version. The API version is the /api/v1 path segment.
deprecation:
  policy_url: https://docs.dustid.io/api/compatibility/
  policy_published: true
  minimum_window_days: 90
  mechanism: >-
    A retiring operation or field is marked `deprecated: true` in the published OpenAPI
    specification and noted in the docs. It keeps working unchanged for at least 90 days
    from the announcement, and a documented replacement is available before or at the
    moment of deprecation whenever one exists.
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  rfc8594_note: >-
    Deprecation is signalled in the specification document, not in HTTP response headers.
    No Sunset or Deprecation header is documented, and none appears in the spec.
  guidance_to_consumers: >-
    DUST tells integrators to diff the published OpenAPI between integration reviews as
    the most reliable way to see what changed.
breaking_change_definition:
- Removing or renaming an endpoint, request parameter, or response field
- Changing a field's type or format
- Making an optional request input required, or narrowing the values an input accepts
- Removing a value from an enumerated field
- Changing the error code or HTTP status returned for an existing, documented failure mode
- Requiring a higher authorization tier or new permission for an existing operation
- Materially changing an operation's semantics, even if its shape is unchanged
additive_without_notice:
- New endpoints and new operations on existing paths
- New optional request parameters, headers, and body fields
- New fields in responses
- New values in enumerated fields
- New error codes for failure modes that previously surfaced as a generic code
- Documentation, error message text, and field ordering
deprecated_operations: []
deprecated_operations_note: >-
  Zero of the 177 operations in the published spec carry `deprecated: true` at time of
  harvest. Several namespaces carry legacy names the docs flag as historical (tags for
  identifiers, bundles for folders/categories, transfers for shipments, Grp for team),
  but they are current API surface, not deprecated.
status_page:
  published: false
  url: null
  note: >-
    No status.dustid.io or status.dustidentity.com exists and no status page is linked
    from the docs or the corporate site. The API does serve standard health probes,
    which is the only public availability signal.
health_endpoints:
- path: /livez
  check: liveness — the process is up
  behavior: always 200 while the server runs
  observed_status: 200
- path: /readyz
  check: readiness — includes a database round-trip
  behavior: 503 if the database check fails or exceeds its 2-second timeout
  observed_status: 200
- path: /healthz
  check: alias for the readiness check
  observed_status: 200
health_probe:
  probed: '2026-08-12'
  host: https://apid.dustid.io
  body: '{"status":"ok","timestamp":"2026-08-12T11:07:17.237Z"}'
sla:
  published: false
  url: null
  uptime_target: null
changelog:
  published: false
  url: null
  note: >-
    No dated changelog or release-notes page is published on docs.dustid.io (the site

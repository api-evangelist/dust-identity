spec_determinism:
  deterministic: false
  severity: high
  method: probed
  probed: '2026-08-12'
  finding: >-
    The published OpenAPI document is NOT byte-stable. Two consecutive fetches of
    https://apid.dustid.io/api/openapi.json return specs that differ in 18 component
    schemas, with ZERO overlap between the two sets of values — the generator emits a
    freshly random UUID into the `default` of every UUID-typed field each time it runs.
  affected_schemas_count: 18
  affected_schemas:
  - ThreadFieldDefinitionBoolean
  - ThreadFieldDefinitionDate
  - ThreadFieldDefinitionDateRange
  - ThreadFieldDefinitionDatetime
  - ThreadFieldDefinitionDuration
  - ThreadFieldDefinitionEmail
  - ThreadFieldDefinitionJson
  - ThreadFieldDefinitionLongText
  - ThreadFieldDefinitionNumber
  - ThreadFieldDefinitionResource
  - ThreadFieldDefinitionText
  - ThreadFieldDefinitionTime
  affected_schemas_note: >-
    Twelve named above; 18 schemas differ per fetch in total, all of them
    ThreadFieldDefinition* variants carrying a UUID field whose `default` is randomized.
  example_drift:
    field: components.schemas.ThreadFieldDefinitionBoolean … default
    fetch_a: d0b75ffb-defb-4fef-abca-36e510a6f447
    fetch_b: b12119c2-cc44-4694-bce7-b533d24fa2a3
    description_of_field: 'a UUID'
  why_it_matters: >-
    This defeats the exact mechanism DUST tells integrators to rely on. With no changelog
    and no release-notes feed, the compatibility page instructs consumers to diff the
    published OpenAPI between integration reviews as the way to see what changed — and
    every such diff reports 18 changed schemas that did not change. Real additive changes
    are buried in permanent noise, spec checksums and ETags are useless for change
    detection, and any CI job that pins or diffs the contract fails or churns on every run.
  scope_note: >-
    The drift is confined to `default` values on UUID-typed fields. Path count (147),
    operation count (177), schema count (285) and info.version (2026.7.4) are stable
    across fetches, so the contract itself is not changing — only its serialization.
  provider_action: >-
    Make the UUID `default` values static (or drop them — a random UUID is not a
    meaningful default for a field the server assigns), so the document is reproducible
    build-over-build and a diff means something.
  evidence:
  - url: https://apid.dustid.io/api/openapi.json
    status: 200
    note: fetch A
  - url: https://apid.dustid.io/api/openapi.json
    status: 200
    note: fetch B, same session — 18 schemas differ, 0 of 18 UUID defaults shared
  - url: https://docs.dustid.io/openapi.json
    status: 200
    note: >-
      The build-time copy served from the docs host is the same spec by version and
      counts, and differs from the live one in the same 18 schemas for the same reason.

apis:
- name: DUST API
  description: The core DUST Platform API (apid). REST over HTTPS with a bearer-JWT Service Account
    model, organization/team context headers, cursor pagination and a single stable error envelope.
    Covers Threads, Identifiers (tags), Files (tus resumable uploads), Bundles/Folders, Templates,
    Certificates and Certificate Forms, Teams, Sharing, cross-organization Connections, Transfers/Shipments,
    Slices, Fabric provenance, Thread Links and Relations, Events, Notifications, Metrics and Org
    Admin.
  humanURL: https://docs.dustid.io/reference/api/
  baseURL: https://apid.dustid.io
  tags:
  - Identity
  - Traceability
  - Provenance
  - Supply Chain

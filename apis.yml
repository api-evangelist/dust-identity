aid: dust-identity
name: Dust Identity
description: 'DUST Identity (Newton, Massachusetts; founded 2018 as an MIT spinout) binds physical
  objects to trusted digital records using the Diamond Unclonable Security Tag — an applied coating
  of engineered nano-diamonds in a polymer matrix that forms an unclonable optical fingerprint. The
  DUST Platform (DICE) tracks each marked item as a "Thread": a digital record carrying typed fields,
  files, physical identifiers (DUST, QR, barcode, Data Matrix, NFC), an immutable event history,
  and Fabric lineage across slices, shipments and organization boundaries. It is used for aerospace
  and defense raw-material traceability, secure electronics, certified-pre-owned authentication,
  return-fraud detection, security labeling and high-value asset identity. The company publishes
  a public OpenAPI 3.1 contract for the DUST API (apid) covering 177 operations, a Starlight documentation
  site, llms.txt, and two provider-authored agent skills.'

note: >-
  DUST documents no rate limits. This is a deliberate check, not an omission: the
  conventions page is a thorough, explicit statement of the cross-cutting request
  contract — it covers context headers, the error envelope, pagination, localization
  and request tracing — and it says nothing about throttling. A full-text search of the
  complete documentation corpus (llms-full.txt, 289KB, the entire docs site as one
  document) returns zero occurrences of "rate limit", "throttle", "429", "Retry-After"
  or "X-RateLimit". The published OpenAPI declares 493 error responses across 177
  operations and not one of them is a 429; the declared status codes are 400, 401, 403,
  404, 500 and 503 only. An agent therefore has no runtime signal to back off on, and no
  documented ceiling to design against — it can only infer capacity from failure.

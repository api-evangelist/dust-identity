note: >-
  DUST publishes under the @dustid npm scope. Registry metadata was read from
  registry.npmjs.org on 2026-08-12. The headline client — @dustid/apid-client, the
  typed TypeScript client the DICE web app itself uses — is documented in detail but
  is NOT on the public npm registry (registry.npmjs.org/@dustid/apid-client returns
  404); DUST states it "is currently distributed by DUST rather than published to the
  public npm registry" and is available to integration customers on request via
  support@dustidentity.com. That makes the only publicly installable first-party
  package @dustid/dust-go-connect, the browser-side scanning bridge. No Python, Java,
  Go, .NET, Ruby, PHP or Rust client is published or documented.
